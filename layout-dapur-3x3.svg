<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 750" role="img" aria-labelledby="layout-title layout-desc" class="layout-svg">
<title id="layout-title">Layout dapur 3 × 3 meter</title>
<desc id="layout-desc">Denah dapur: bak cuci, kompor, grill dan rice cooker di dinding belakang; meja prep dan freezer di dinding kiri; meja packing dan rak pickup di dinding kanan; pintu di dinding depan. Alur kerja: bahan masuk, simpan, prep, masak, packing, serah ke driver.</desc>
<style>
.layout-svg{font-family:'Plus Jakarta Sans',Arial,sans-serif;background:#fbfcf8}
.floor{fill:#fbfcf8}.wall{fill:none;stroke:#1d2620;stroke-width:10}
.fx-store{fill:#dbe7f2;stroke:#3d6a8f}.fx-prep{fill:#e3eedb;stroke:#2f6b3f}
.fx-cook{fill:#f8e1c4;stroke:#b5651d}.fx-pack{fill:#f4ecc7;stroke:#9a7a12}.fx-pick{fill:#ece3f1;stroke:#6b4d85}
.fx{stroke-width:1.5}.t1{font-size:13px;font-weight:700;fill:#1d2620}.t2{font-size:10.5px;fill:#4a5a4f}
.dim{stroke:#6f7f74;stroke-width:1}.dimt{font-size:12px;fill:#4a5a4f;font-weight:600}
.hood{fill:none;stroke:#b5651d;stroke-dasharray:5 4;stroke-width:1.2}
.flow{fill:none;stroke:#2f6b3f;stroke-width:2.2;stroke-dasharray:7 5}
.badge{fill:#2f6b3f}.badget{fill:#fff;font-size:12px;font-weight:700}
.door{fill:none;stroke:#1d2620;stroke-width:1.5}.gap{fill:#fbfcf8}.win{stroke:#3d6a8f;stroke-width:3}
.walk{font-size:11.5px;fill:#4a5a4f;font-style:italic}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="badge"/></marker></defs>
<rect class="floor" x="90" y="80" width="600" height="600"/>
<rect class="fx fx-prep" x="90" y="80" width="120" height="120" rx="3"/>
<text class="t1" x="150.0" y="137.0" text-anchor="middle">Bak cuci</text>
<text class="t2" x="150.0" y="152.0" text-anchor="middle">60×60</text>
<rect class="fx fx-cook" x="210" y="80" width="200" height="120" rx="3"/>
<text class="t1" x="310.0" y="137.0" text-anchor="middle">Kompor 2 tungku</text>
<text class="t2" x="310.0" y="152.0" text-anchor="middle">100×60 · gas di bawah</text>
<rect class="fx fx-cook" x="410" y="80" width="180" height="120" rx="3"/>
<text class="t1" x="500.0" y="137.0" text-anchor="middle">Grill / griddle</text>
<text class="t2" x="500.0" y="152.0" text-anchor="middle">90×60</text>
<rect class="fx fx-pack" x="590" y="80" width="100" height="120" rx="3"/>
<text class="t1" x="640.0" y="137.0" text-anchor="middle">Rice</text>
<text class="t2" x="640.0" y="152.0" text-anchor="middle">cooker</text>
<rect class="fx fx-prep" x="90" y="220" width="120" height="260" rx="3"/>
<text class="t1" x="150.0" y="347.0" text-anchor="middle">Meja prep</text>
<text class="t2" x="150.0" y="362.0" text-anchor="middle">stainless 130×60</text>
<rect class="fx fx-store" x="90" y="500" width="120" height="180" rx="3"/>
<text class="t1" x="150.0" y="587.0" text-anchor="middle">Chest</text>
<text class="t2" x="150.0" y="602.0" text-anchor="middle">freezer 100 L</text>
<rect class="fx fx-pack" x="570" y="220" width="120" height="260" rx="3"/>
<text class="t1" x="630.0" y="347.0" text-anchor="middle">Meja packing</text>
<text class="t2" x="630.0" y="362.0" text-anchor="middle">130×60 · HP + printer</text>
<rect class="fx fx-pick" x="590" y="520" width="100" height="160" rx="3"/>
<text class="t1" x="640.0" y="597.0" text-anchor="middle">Rak</text>
<text class="t2" x="640.0" y="612.0" text-anchor="middle">pickup</text>
<rect class="hood" x="218" y="84" width="184" height="100" rx="2"/>
<rect class="hood" x="418" y="84" width="164" height="100" rx="2"/>
<text class="t2" x="400" y="68" text-anchor="middle">▲ exhaust fan di atas kompor &amp; grill ▲</text>
<rect class="wall" x="90" y="80" width="600" height="600"/>
<line class="win" x1="90" y1="90" x2="90" y2="190"/>
<text class="t2" x="80" y="140" text-anchor="end">jendela /</text>
<text class="t2" x="80" y="153" text-anchor="end">ventilasi</text>
<rect class="gap" x="370" y="674" width="180" height="12"/>
<line class="door" x1="550" y1="680" x2="550" y2="500"/>
<path class="door" stroke-dasharray="3 3" d="M370,680 A180,180 0 0 1 550,500"/>
<text class="t1" x="460" y="706" text-anchor="middle">PINTU 90 cm</text>
<text class="t2" x="460" y="721" text-anchor="middle">bahan masuk · driver ambil pesanan</text>
<line class="dim" x1="218" y1="304" x2="562" y2="304" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text class="walk" x="390" y="292" text-anchor="middle">jalur kerja ±180 cm</text>
<path class="flow" d="M390,656 L246,590 L246,380 L310,240 L500,240 L534,380 L534,580 L490,652" marker-end="url(#arr)"/>
<circle class="badge" cx="390" cy="620" r="11"/>
<text class="badget" x="390"  y="624" text-anchor="middle">1</text>
<circle class="badge" cx="150" cy="532" r="11"/>
<text class="badget" x="150"  y="536" text-anchor="middle">2</text>
<circle class="badge" cx="150" cy="410" r="11"/>
<text class="badget" x="150"  y="414" text-anchor="middle">3</text>
<circle class="badge" cx="310" cy="104" r="11"/>
<text class="badget" x="310"  y="108" text-anchor="middle">4</text>
<circle class="badge" cx="500" cy="104" r="11"/>
<text class="badget" x="500"  y="108" text-anchor="middle">4</text>
<circle class="badge" cx="630" cy="410" r="11"/>
<text class="badget" x="630"  y="414" text-anchor="middle">5</text>
<circle class="badge" cx="640" cy="654" r="11"/>
<text class="badget" x="640"  y="658" text-anchor="middle">6</text>
<line class="dim" x1="90" y1="40" x2="690" y2="40" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text class="dimt" x="390" y="33" text-anchor="middle">3,00 m</text>
<line class="dim" x1="722" y1="80" x2="722" y2="680" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text class="dimt" x="738" y="380" text-anchor="middle" transform="rotate(90 738 380)">3,00 m</text>
</svg>